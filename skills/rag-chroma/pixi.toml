[workspace]
channels = ["conda-forge"]
name = "chroma"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.2.0"

[dependencies]
python = ">=3.13.11,<3.14"
langchain-text-splitters = ">=1.1.0,<2"
python-dotenv = ">=1.2.1,<2"
pytorch-cpu = "*"

[pypi-dependencies]
langchain-core = "*"
fastembed = ">=0.7.4, <0.8"
chromadb = ">=1.4.1,<2"
snowballstemmer = ">=3.0.1, <4"
langchain-ollama = "*"
langchain = ">=1.0.0"
langgraph = "*"
halo = "*"

[feature.test.dependencies]
pytest = "*"

[environments]
test = ["test"]

[tasks]
ingest = { cmd = "python scripts/ingest_md.py", description = "Ingest documents into Chroma database." }
search = { cmd = "python scripts/chroma_search.py", description = "Search documents in ingested Chroma database." }
clean = { cmd = "rm -rf ./chroma_db", description = "Clean the local Chroma database." }
reindex = { depends-on = ["clean", "ingest"], description = "Reindex the Chroma database." }
test = { cmd="PYTHONPATH=scripts python -m pytest tests", default-environment="test", description = "Run the tests." }
chat = { cmd = "python scripts/ollama_chat.py", description = "Chat with the Chroma database using Ollama." }
